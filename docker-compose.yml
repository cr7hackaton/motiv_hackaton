services:
  db:
    image: mariadb:10.1
    # Образ 10.1 собран только под amd64 — на ARM (Apple Silicon) работает через эмуляцию
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: web_report
      MYSQL_USER: ${DB_USER:-report}
      MYSQL_PASSWORD: ${DB_PASSWORD:-reportpass}
      TZ: ${TZ:-Asia/Yekaterinburg}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # Только локальный интерфейс хоста (MOT-046): наружу порт БД не публикуем
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: web_report
      DB_USER: ${DB_USER:-report}
      DB_PASSWORD: ${DB_PASSWORD:-reportpass}
      SECRET_KEY: ${SECRET_KEY:-change-me-please}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      TZ: ${TZ:-Asia/Yekaterinburg}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db_data:
