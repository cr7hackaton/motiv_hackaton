{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<h1>Смена пароля</h1>
<p class="muted">Вы меняете пароль своей учётной записи — <b>{{ session.name }}</b>.</p>
<form method="post" class="card acct-pass">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Текущий пароль
    <input name="current" type="password" required autofocus>
  </label>
  <label>Новый пароль
    <input name="new" type="password" minlength="6" required placeholder="минимум 6 символов">
  </label>
  <button class="btn primary" type="submit">Сменить пароль</button>
</form>
{% endblock %}
