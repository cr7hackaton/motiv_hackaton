{% extends "base.html" %}
{% block title %}Вход — Веб отчетность{% endblock %}
{% block content %}
<form method="post" class="login card">
  <img class="logo-lg" src="{{ url_for('static', filename='logo-full.png') }}" alt="Мотив — Веб отчётность" width="72" height="72"
       onerror="this.onerror=null;this.src='{{ url_for('static', filename='logo-mark.svg') }}'">
  <h1>Веб отчётность</h1>
  <p class="muted">Учёт аварий на базовых станциях</p>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Логин<input name="login" autofocus required></label>
  <label>Пароль<input name="password" type="password" required></label>
  <button class="btn primary" type="submit">Войти</button>
</form>
{% endblock %}
